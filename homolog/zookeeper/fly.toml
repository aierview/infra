app = 'homolog-zookeeper'
primary_region = 'gig'

[build]

[http_service]
  internal_port = 2181
  force_https = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
