version: '3.9'

services:
  kafdrop:
    container_name: kafdrop
    build:
      context: ./kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
    networks:
      - aierview-network

  kafka:
    container_name: kafka
    build:
      context: ./kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:29092
    networks:
      - aierview-network

  postgres:
    container_name: postgres
    build:
      context: ./postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aierview
    networks:
      - aierview-network

  redis:
    container_name: redis
    build:
      context: ./redis
    ports:
      - "6379:6379"
    networks:
      - aierview-network

  zookeeper:
    container_name: zookeeper
    build:
      context: ./zookeeper
    ports:
      - "22181:2181"
    networks:
      - aierview-network

networks:
  aierview-network:
    external: true