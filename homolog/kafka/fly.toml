# fly.toml app configuration file generated for homolog-kafka on 2025-08-22T16:15:03-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'homolog-kafka'
primary_region = 'gig'

[build]

[[services]]
  internal_port = 9092
  protocol = "tcp"

  [[services.ports]]
    port = 9092
    handlers = []

  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  internal_port = 29092
  protocol = "tcp"

  [[services.ports]]
    port = 29092
    handlers = []

  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
memory = '2gb'
cpu_kind = 'shared'
cpus = 1
